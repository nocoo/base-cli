# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, Z1 via quality.yml;
# na L1.5, L2, L3; todo P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.3.14"
      node-version: "26.12.1"
      install-policy: blocked
      coverage-path: coverage
      typecheck-command: bun run typecheck
      test-command: bun run test:coverage
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-yamllint: true
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "非 Cloudflare Worker 项目，无 workerd / miniflare 运行时测试"},
        "L2": {"status": "na", "reason": "无整服务对外 HTTP API E2E；OAuth 回环 HTTP 已在 L1 Vitest 中覆盖"},
        "L3": {"status": "na", "reason": "CLI 基础库，无浏览器界面与 Playwright E2E"},
        "P1": {"status": "todo", "reason": "发布 @nocoo/base-cli 但尚未接入 npm pack / publint 的 CI 门禁"},
        "Z1": {"status": "impl"}}
